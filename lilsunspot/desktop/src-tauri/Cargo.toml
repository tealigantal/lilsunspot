[package]
name = "lilsunspot_desktop"
version = "0.1.0"
description = "Lilsunspot desktop shell"
authors = ["lilsunspot"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "Lilsunspot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
